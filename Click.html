.cheek.left{left:12px}

    height:18px;
    border-top:2px solid #222;
    transform:rotate(-22deg);
    transform-origin:left center;
}

    position:absolute;
    right:-4px;
    top:-8px;
    width:17px;
    height:14px;
    border:2px solid #222;

}

.tiny{

    left:99px;
    top:40px;
    color:#ed7890;
    font-size:16px;

}

    font-family:cursive;
    font-size:18px;
    font-weight:bold;

/* =========================

========================= */

.loveText{
    position:absolute;
    left:50%;
    bottom:34px;
    transform:translateX(-50%);

    font-family:"Times New Roman",serif;
    font-size:31px;
    font-weight:bold;
    color:#d95a78;

    opacity:0;
    animation:textIn .8s ease forwards;

    animation-delay:3.8s;
}

@keyframes personIn{
    from{
        opacity:0;
        transform:translateX(-12px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes textIn{
    from{
        opacity:0;
        transform:translate(-50%,8px);
    }

    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}
